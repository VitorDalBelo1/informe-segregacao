# Define uma nova porta HTTP para este microserviço (ex: 8081, 8082, etc.)
quarkus.http.port=8081


# ===================== MOCK PRODUCER (origem) =====================
%local.mp.messaging.outgoing.gerador-entrada.connector=smallrye-in-memory
mp.messaging.outgoing.gerador-entrada.connector=smallrye-kafka
mp.messaging.outgoing.gerador-entrada.bootstrap.servers=${KAFKA_ORIGEM_BOOTSTRAP:localhost:9092}
mp.messaging.outgoing.gerador-entrada.topic=${KAFKA_ORIGEM_TOPICO:sispm.posicional.entrada}
mp.messaging.outgoing.gerador-entrada.value.serializer=org.apache.kafka.common.serialization.StringSerializer
# ---------------------------------------------------------------------------
# REST client - Plataforma Publica de Split Payment
# ---------------------------------------------------------------------------
quarkus.rest-client.pp-split-payment.url=http://localhost:8080
quarkus.rest-client.pp-split-payment.scope=jakarta.inject.Singleton
quarkus.rest-client.pp-split-payment.connect-timeout=5000
quarkus.rest-client.pp-split-payment.read-timeout=15000


quarkus.kafka.devservices.enabled=false
# ===================== BROKER DE ORIGEM (consome posicional) =====================
%local.mp.messaging.incoming.entrada.connector=smallrye-in-memory
mp.messaging.incoming.entrada.connector=smallrye-kafka
mp.messaging.incoming.entrada.bootstrap.servers=${KAFKA_ORIGEM_BOOTSTRAP:localhost:9092}
mp.messaging.incoming.entrada.topic=${KAFKA_ORIGEM_TOPICO:sispm.posicional.entrada}
mp.messaging.incoming.entrada.group.id=${KAFKA_ORIGEM_GROUP:informe-segregacao}
mp.messaging.incoming.entrada.auto.offset.reset=earliest
mp.messaging.incoming.entrada.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Mensagem invalida (layout quebrado) vai para DLQ no broker de origem
mp.messaging.incoming.entrada.failure-strategy=dead-letter-queue
mp.messaging.incoming.entrada.dead-letter-queue.topic=${KAFKA_ORIGEM_DLQ:sispm.posicional.dlq}

%local.quarkus.kafka.devservices.enabled=true