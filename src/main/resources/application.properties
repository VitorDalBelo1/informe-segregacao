# Define uma nova porta HTTP para este microserviço (ex: 8081, 8082, etc.)
quarkus.http.port=8081


# ---------------------------------------------------------------------------
# REST client - Plataforma Publica de Split Payment
# ---------------------------------------------------------------------------
quarkus.rest-client.pp-split-payment.url=http://localhost:8080
quarkus.rest-client.pp-split-payment.scope=jakarta.inject.Singleton
quarkus.rest-client.pp-split-payment.connect-timeout=5000
quarkus.rest-client.pp-split-payment.read-timeout=15000


## ===================== MOCK PRODUCER (origem) =====================
#%dev.mp.messaging.outgoing.gerador-entrada.connector=smallrye-kafka
#%prod.mp.messaging.outgoing.gerador-entrada.connector=smallrye-kafka
#%dev.mp.messaging.outgoing.gerador-entrada.bootstrap.servers=${KAFKA_ORIGEM_BOOTSTRAP:localhost:9092}
#%prod.mp.messaging.outgoing.gerador-entrada.bootstrap.servers=${KAFKA_ORIGEM_BOOTSTRAP:localhost:9092}
