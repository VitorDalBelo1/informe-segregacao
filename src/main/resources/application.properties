# ===================== BROKER DE ORIGEM (consome posicional) =====================
%dev.mp.messaging.incoming.entrada.connector=smallrye-kafka
%prod.mp.messaging.incoming.entrada.connector=smallrye-kafka
%dev.mp.messaging.incoming.entrada.bootstrap.servers=${KAFKA_ORIGEM_BOOTSTRAP:localhost:9092}
%prod.mp.messaging.incoming.entrada.bootstrap.servers=${KAFKA_ORIGEM_BOOTSTRAP:localhost:9092}
%dev.mp.messaging.incoming.entrada.topic=${KAFKA_ORIGEM_TOPICO:sispm.posicional.entrada}
%prod.mp.messaging.incoming.entrada.topic=${KAFKA_ORIGEM_TOPICO:sispm.posicional.entrada}
%dev.mp.messaging.incoming.entrada.group.id=${KAFKA_ORIGEM_GROUP:informe-segregacao}
%prod.mp.messaging.incoming.entrada.group.id=${KAFKA_ORIGEM_GROUP:informe-segregacao}
%dev.mp.messaging.incoming.entrada.auto.offset.reset=earliest
%prod.mp.messaging.incoming.entrada.auto.offset.reset=earliest
%dev.mp.messaging.incoming.entrada.value.deserializer=processors.SegregacaoDeserializer
%prod.mp.messaging.incoming.entrada.value.deserializer=processors.SegregacaoDeserializer
# Mensagem invalida (layout quebrado) vai para DLQ no broker de origem
%dev.mp.messaging.incoming.entrada.failure-strategy=dead-letter-queue
%prod.mp.messaging.incoming.entrada.failure-strategy=dead-letter-queue
%dev.mp.messaging.incoming.entrada.dead-letter-queue.topic=${KAFKA_ORIGEM_DLQ:sispm.posicional.dlq}
%prod.mp.messaging.incoming.entrada.dead-letter-queue.topic=${KAFKA_ORIGEM_DLQ:sispm.posicional.dlq}

# ---- Liga/desliga o Kafka pelo profile ----
# Kafka LIGADO : ./mvnw quarkus:dev                              (profile dev)  ou prod
# Kafka DESLIGADO (mock): ./mvnw quarkus:dev -Dquarkus.profile=local
# No profile 'local' o canal 'entrada' fica sem conector e é alimentado pelo LocalMockPublisher.
%local.quarkus.kafka.devservices.enabled=false


sispm.psp.cnpj.raiz=${RAIZCNPJPSP:00000000}